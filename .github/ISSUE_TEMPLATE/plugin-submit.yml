name: 插件投稿
description: 把你的插件提交上架到 Star OS 插件商店
title: "[投稿] 插件名"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        上架前请先读 [插件开发文档](../blob/main/docs/插件开发文档.md),
        尤其是第 8 节「审核红线」。**包里禁止任何二进制文件。**

        如果你熟悉 Git,更推荐直接提 PR 到 `submissions/<插件id>/`。

  - type: input
    id: pid
    attributes:
      label: 插件 id
      description: 反向域名小写,例如 com.you.myplugin
      placeholder: com.you.myplugin
    validations:
      required: true

  - type: input
    id: pname
    attributes:
      label: 插件名称
      placeholder: 我的插件
    validations:
      required: true

  - type: input
    id: pver
    attributes:
      label: 版本 / versionCode
      placeholder: "1.0.0 / 1"
    validations:
      required: true

  - type: dropdown
    id: perms
    attributes:
      label: 申请的权限
      description: 按最小够用原则选。选多了审核会问原因。
      multiple: true
      options:
        - ui
        - notify
        - storage.read
        - storage.write
        - network
        - settings.read
        - settings.write
        - shell(高风险)
        - system.prop(高风险)
        - app.install(高风险)
    validations:
      required: true

  - type: dropdown
    id: hooks
    attributes:
      label: 触发时机
      multiple: true
      options:
        - install
        - boot
        - manual
        - uninstall
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 这个插件做什么
      description: 一两句说清楚。如果申请了高风险权限,请说明**为什么非它不可**。
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: 插件包下载链接
      description: .sosp 的直链,或者一个能拿到它的页面
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 源码
      description: 上架要求源码公开可查。贴仓库地址,或把 plugin.json 和 main.sh 直接贴在这里。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我的插件里没有任何二进制文件(ELF / .so / .apk / .dex / .jar)
          required: true
        - label: 我用系统能力时都走了 sos-* 包装命令,且已声明对应权限
          required: true
        - label: 我读过审核红线,里面禁止的动作我都没用
          required: true

  - type: textarea
    id: note
    attributes:
      label: 其它说明(可选)
      description: 测试环境、已知问题、想说的话
    validations:
      required: false
